name: CI

# Lint + tests (including checks of deploy/*.yaml) on every PR and push.
# On push to main: build the agent image for amd64 + arm64 and push it to Docker Hub as
#   docker.io/<DOCKERHUB_USERNAME>/learner:latest
# "Run workflow" on main (Actions tab) rebuilds and pushes the image without a code change:
# use it to pick up operating-system security updates.
# Needs (GitHub > Settings > Secrets and variables > Actions):
#   variable DOCKERHUB_USERNAME  - your Docker Hub user or organization
#   secret   DOCKERHUB_TOKEN     - a Docker Hub access token with Read & Write

on:
  pull_request:
    branches: [main]
    paths: ["agent/**", "deploy/**", "webui/**", ".github/workflows/ci.yml"]
  push:
    branches: [main]
    paths: ["agent/**", "deploy/**", "webui/**", ".github/workflows/ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: learner   # the repository name only; the tag is added below and is always "latest"

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: flake8
        run: flake8 . --count --select=E9,F63,F7,F82,F401,F841 --show-source --statistics
      - name: pytest (agent + deploy/*.yaml checks)
        run: pytest tests -q

  build-and-push:
    name: Build & push image to Docker Hub
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Image name
        id: meta
        run: echo "image=docker.io/${{ vars.DOCKERHUB_USERNAME }}/${IMAGE_NAME%%:*}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Summary
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          {
            echo "### Image pushed"
            echo ""
            echo "\`${IMAGE}:latest\` (commit ${GITHUB_SHA::7}), for linux/amd64 and linux/arm64"
            echo ""
            echo "Pick it up: redeploy the service on Render, or in a cluster"
            echo "\`kubectl -n pq rollout restart deploy/pq\`"
          } >> "$GITHUB_STEP_SUMMARY"
